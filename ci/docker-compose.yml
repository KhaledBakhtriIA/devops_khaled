# Stack CI locale : Jenkins + SonarQube + Nexus sur le même réseau Docker.
# Démarrage :  cd ci && docker compose up -d --build
#
#   Jenkins   -> http://localhost:8088   (port 8088 pour ne pas gêner le backend Spring sur 8080)
#   SonarQube -> http://localhost:9000   (admin / admin au premier login)
#   Nexus     -> http://localhost:8081   (admin / mot de passe dans le conteneur, voir README-CI.md)
#
# Entre conteneurs, les services se joignent par leur nom :
#   http://jenkins:8080   http://sonarqube:9000   http://nexus:8081

services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    ports:
      - "8088:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks: [ci]
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      # Évite l'erreur "vm.max_map_count too low" sous Docker Desktop / WSL2
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks: [ci]
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3
    container_name: nexus
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data
    networks: [ci]
    restart: unless-stopped

networks:
  ci:
    name: ci

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  nexus_data:
