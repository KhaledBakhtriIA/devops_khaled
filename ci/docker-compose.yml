# Outils de la CI lancés avec Docker : SonarQube + Nexus.
# Jenkins n'est PAS ici : il est installé dans Ubuntu (WSL) sur http://localhost:8081
#
# Démarrage :  cd ci && docker compose up -d
#
#   SonarQube -> http://localhost:9000   (admin / admin au premier login)
#   Nexus     -> http://localhost:8082   (port 8082 car Jenkins utilise déjà 8081)

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      # Évite l'erreur "vm.max_map_count too low" sous Docker Desktop / WSL2
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3
    container_name: nexus
    ports:
      - "8082:8081"   # hôte 8082 -> Nexus 8081 dans le conteneur
    volumes:
      - nexus_data:/nexus-data
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  nexus_data:
